[package]
name = "ncaptura"
version = "0.2.0"
edition = "2024"
description = "Wayland screenshot / screen recording / OCR / translation tool (GTK4 + Libadwaita)"
authors = ["arcat0v0"]
license = "MIT OR Apache-2.0"

[dependencies]
adw = { package = "libadwaita", version = "0.8", features = ["v1_4"] }
anyhow = "1.0"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6.0"
gtk = { package = "gtk4", version = "0.10", features = ["v4_8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
ureq = "3"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", features = ["screencast"] }
futures-util = "0.3"
gstreamer = "0.24"
gtk4-layer-shell = "0.7"
libc = "0.2"
libspa = { version = "0.9", features = ["v0_3_40"] }
pipewire = { version = "0.9", features = ["v0_3_49"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }
signal-hook = "0.3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
maintainer = "arcat0v0"
section = "utils"
priority = "optional"
revision = ""
depends = "libgtk-4-1 (>= 4.8), libadwaita-1-0, libgtk4-layer-shell0, gstreamer1.0, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-ugly, gstreamer1.0-pipewire, pipewire, grim, slurp, wf-recorder, wl-clipboard"
recommends = "pulseaudio-utils, python3 (>= 3.10), spectacle"
assets = [
    ["target/release/ncaptura", "usr/bin/ncaptura", "755"],
    ["README.md", "usr/share/doc/ncaptura/README.md", "644"],
    ["docs/README_EN.md", "usr/share/doc/ncaptura/README_EN.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/ncaptura", dest = "/usr/bin/ncaptura", mode = "755" },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/ncaptura/LICENSE-APACHE", mode = "644" },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/ncaptura/LICENSE-MIT", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/ncaptura/README.md", mode = "644" },
    { source = "docs/README_EN.md", dest = "/usr/share/doc/ncaptura/README_EN.md", mode = "644" },
]

[package.metadata.generate-rpm.requires]
gtk4 = "*"
libadwaita = "*"
gtk4-layer-shell = "*"
gstreamer1 = "*"
gstreamer1-plugins-base = "*"
gstreamer1-plugins-good = "*"
gstreamer1-plugins-ugly = "*"
gstreamer1-plugin-pipewire = "*"
pipewire = "*"
grim = "*"
slurp = "*"
wf-recorder = "*"
wl-clipboard = "*"

[package.metadata.generate-rpm.recommends]
pulseaudio-utils = "*"
python3 = "*"
spectacle = "*"
