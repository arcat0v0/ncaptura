name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match Cargo.toml; without leading v)"
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build artifacts and create draft release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git gh xz-utils \
            pkg-config libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev

      - uses: actions/checkout@v4

      - name: Resolve and verify version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          crate_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "input=${version} crate=${crate_version}"
          test "$version" = "$crate_version"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "::error::tag v${version} already exists on origin"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"

      - uses: dtolnay/rust-toolchain@stable

      - name: Run unit tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb@3.8.0,cargo-generate-rpm@0.21.0

      - name: Build deb, rpm and tarball
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cargo deb --no-build
          cp "target/debian/ncaptura_${VERSION}_amd64.deb" dist/
          cargo generate-rpm
          cp "target/generate-rpm/ncaptura-${VERSION}-1.x86_64.rpm" "dist/ncaptura-${VERSION}.x86_64.rpm"
          mkdir "dist/ncaptura-${VERSION}"
          cp target/release/ncaptura README.md LICENSE-MIT LICENSE-APACHE "dist/ncaptura-${VERSION}/"
          cp -r docs "dist/ncaptura-${VERSION}/"
          tar -C dist -czf "dist/ncaptura-${VERSION}-x86_64.tar.gz" "ncaptura-${VERSION}"
          rm -rf "dist/ncaptura-${VERSION}"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --draft \
            --title "NCaptura ${VERSION}" \
            --generate-notes \
            "dist/ncaptura_${VERSION}_amd64.deb" \
            "dist/ncaptura-${VERSION}.x86_64.rpm" \
            "dist/ncaptura-${VERSION}-x86_64.tar.gz"
          echo "Draft release created. Edit the notes and publish it; publishing triggers the AUR update."

  aur:
    name: Publish stable package to AUR
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: pacman -Sy --noconfirm --needed git openssh curl

      - name: Push ncaptura package to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY}" ]; then
            echo "AUR_SSH_PRIVATE_KEY secret not set; skipping AUR publication"
            exit 0
          fi
          version="${TAG#v}"
          sha256="$(curl -sL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${version}.tar.gz" | sha256sum | cut -d' ' -f1)"
          useradd -m build
          install -dm700 -o build /home/build/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > /home/build/.ssh/id_ed25519
          ssh-keyscan aur.archlinux.org >> /home/build/.ssh/known_hosts
          chmod 600 /home/build/.ssh/id_ed25519
          chown build:build /home/build/.ssh/id_ed25519 /home/build/.ssh/known_hosts
          sed -e "s/^pkgver=.*/pkgver=${version}/" \
              -e "s/^sha256sums=.*/sha256sums=('${sha256}')/" \
              aur/PKGBUILD > /home/build/PKGBUILD
          chown build:build /home/build/PKGBUILD
          runuser -u build -- bash -eux <<EOF
          cd /home/build
          if ! git clone ssh://aur@aur.archlinux.org/ncaptura.git repo; then
            mkdir repo
            git -C repo init
            git -C repo remote add origin ssh://aur@aur.archlinux.org/ncaptura.git
          fi
          cp PKGBUILD repo/PKGBUILD
          git -C repo config user.name "ncaptura-ci"
          git -C repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd repo
          makepkg --printsrcinfo > .SRCINFO
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || git commit -m "release v${version}"
          git push origin HEAD:master
          EOF
